<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Server Explorer</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-drag drag"></div>
        <div class="sidebar-head">
          <span>Servers</span>
          <button class="icon-btn" id="add-server" title="Add server"></button>
        </div>
        <ul class="server-list" id="server-list"></ul>
      </aside>
      <main class="main" id="main">
        <div class="welcome" id="welcome"></div>
      </main>
    </div>
    <div class="toasts" id="toasts"></div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
